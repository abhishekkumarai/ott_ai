# Served by nginx-unprivileged (non-root, listens on 8080).
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

map $sent_http_content_type $cache_ctl {
    default                 "no-cache";
    ~font/                  "public, max-age=31536000, immutable";
    ~image/                 "public, max-age=86400";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    client_max_body_size 32k;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml text/plain;

    # --- security headers (repeated in locations that add their own headers) ---
    set $csp "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://www.youtube.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://i.ytimg.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://fonts.gstatic.com https://i.ytimg.com; frame-src 'self' https://www.youtube-nocookie.com https://www.youtube.com; media-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'";
    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "microphone=(self), camera=(), geolocation=(), payment=(), usb=(), autoplay=(self \"https://www.youtube-nocookie.com\" \"https://www.youtube.com\"), fullscreen=(self \"https://www.youtube-nocookie.com\" \"https://www.youtube.com\"), encrypted-media=(self \"https://www.youtube-nocookie.com\" \"https://www.youtube.com\")" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cache-Control $cache_ctl always;

    location = / { try_files /landing/index.html =404; }
    location = /index.html { return 301 /; }

    location /api/auth/ {
        limit_req zone=auth burst=10 nodelay;
        limit_req_status 429;
        include /etc/nginx/proxy_api.conf;
    }
    location /api/ {
        limit_req zone=api burst=40 nodelay;
        limit_req_status 429;
        include /etc/nginx/proxy_api.conf;
    }

    location = /app { return 301 /app/; }
    location /app/ {
        try_files $uri $uri/ /app/index.html;
    }

    location = /admin { return 301 /admin/; }
    location /admin/ { try_files $uri $uri/index.html =404; }
    location /player/ { try_files $uri =404; }
    location /assets/ { try_files $uri =404; }
    location /fonts/ { try_files $uri =404; }
    location = /favicon.svg { try_files /favicon.svg =404; }

    location ~ /\. { deny all; }
    location / { return 404; }
}
